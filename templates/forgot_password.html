<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Pro - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            overflow-x: hidden;
            position: relative;
        }
        
        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .shape-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }
        
        .shape-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
        }
        
        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 30%;
        }
        
        .forgot-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }
        
        .medical-icons {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
        }
        
        .medical-icons i {
            font-size: 24px;
            color: rgba(106, 17, 203, 0.5);
            background: white;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 50px;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #666;
            font-size: 16px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a11cb;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: #6a11cb;
            outline: none;
            box-shadow: 0 0 10px rgba(106, 17, 203, 0.2);
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .back-to-login a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-to-login a:hover {
            color: #2575fc;
            text-decoration: underline;
        }
        
        .flash-messages {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }
        
        .alert {
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            color: white;
            display: flex;
            align-items: center;
            animation: slideIn 0.5s forwards;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .alert-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }
        
        .alert-error {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }
        
        .alert-info {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .instructions {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="flash-messages">
        <!-- Flash messages will be inserted here by JavaScript -->
    </div>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="forgot-container">
        <div class="medical-icons">
            <i class="fas fa-heartbeat icon-1"></i>
            <i class="fas fa-user-injured icon-2"></i>
        </div>

        <div class="logo">
            <i class="fas fa-key"></i>
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset OTP</p>
        </div>

        <p class="instructions">
            Enter your registered email address and we'll send you a One-Time Password (OTP) to reset your password.
        </p>

        <form id="forgot-password-form" method="POST">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Send OTP</button>
        </form>

        <div class="back-to-login">
            <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const forgotPasswordForm = document.getElementById('forgot-password-form');
            const submitBtn = document.getElementById('submit-btn');

            // Handle form submission
            forgotPasswordForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.querySelector('input[name="email"]').value;
                
                if (!email) {
                    showFlashMessage('Please enter your email address', 'error');
                    return;
                }

                // Validate email format
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showFlashMessage('Please enter a valid email address', 'error');
                    return;
                }

                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending OTP...';

                try {
                    const response = await fetch("{{ url_for('forgot_password') }}", {
                        method: 'POST',
                        headers: { 
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: "email=" + encodeURIComponent(email)
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        showFlashMessage(data.message, 'success');
                        // Redirect to OTP verification page after a short delay
                        setTimeout(() => {
                            window.location.href = "{{ url_for('verify_otp') }}";
                        }, 1500);
                    } else {
                        showFlashMessage(data.message, 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showFlashMessage('Network error. Please try again.', 'error');
                } finally {
                    // Re-enable button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send OTP';
                }
            });

            // Flash message function
            function showFlashMessage(message, type) {
                const flashContainer = document.querySelector('.flash-messages');
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type}`;
                const iconClass = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
                alertDiv.innerHTML = `<i class="fas ${iconClass}" style="margin-right: 10px;"></i> ${message}`;
                flashContainer.appendChild(alertDiv);
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 5000);
            }
        });
    </script>
</body>
</html>
