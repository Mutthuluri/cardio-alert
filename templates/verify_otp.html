<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Pro - Verify OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            position: relative;
        }
        
        .otp-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 50px;
            color: #6a11cb;
            margin-bottom: 15px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #666;
            font-size: 16px;
        }
        
        .otp-input {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .otp-input input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .otp-input input:focus {
            border-color: #6a11cb;
            outline: none;
            box-shadow: 0 0 10px rgba(106, 17, 203, 0.2);
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .back-link a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: rgba(46, 213, 115, 0.2);
            border: 1px solid #2ed573;
            color: #2ed573;
        }

        .error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
        }

        .purpose-info {
            background: rgba(106, 17, 203, 0.1);
            border: 1px solid #6a11cb;
            color: #6a11cb;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
            <h1>Verify OTP</h1>
            <p>Enter the 6-digit code sent to your email</p>
        </div>

        <!-- Purpose Information -->
        <div class="purpose-info">
            {% if purpose == 'registration' %}
                <i class="fas fa-user-plus"></i> Completing Registration
            {% else %}
                <i class="fas fa-key"></i> Password Reset
            {% endif %}
        </div>

        <div id="message" class="message"></div>

        <form id="otp-form">
            <div class="otp-input">
                <input type="text" id="otp-1" maxlength="1" onkeyup="moveToNext(this, 'otp-2')">
                <input type="text" id="otp-2" maxlength="1" onkeyup="moveToNext(this, 'otp-3')">
                <input type="text" id="otp-3" maxlength="1" onkeyup="moveToNext(this, 'otp-4')">
                <input type="text" id="otp-4" maxlength="1" onkeyup="moveToNext(this, 'otp-5')">
                <input type="text" id="otp-5" maxlength="1" onkeyup="moveToNext(this, 'otp-6')">
                <input type="text" id="otp-6" maxlength="1">
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">Verify OTP</button>
        </form>

        <div class="back-link">
            {% if purpose == 'registration' %}
                <a href="{{ url_for('register') }}"><i class="fas fa-arrow-left"></i> Back to Registration</a>
            {% else %}
                <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
            {% endif %}
        </div>
    </div>

    <script>
        function moveToNext(current, nextFieldId) {
            if (current.value.length === current.maxLength) {
                if (nextFieldId) {
                    document.getElementById(nextFieldId).focus();
                }
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Auto hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }

       document.getElementById('otp-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const otp = document.getElementById('otp-1').value +
               document.getElementById('otp-2').value +
               document.getElementById('otp-3').value +
               document.getElementById('otp-4').value +
               document.getElementById('otp-5').value +
               document.getElementById('otp-6').value;

    if (otp.length !== 6) {
        showMessage('Please enter complete 6-digit OTP', 'error');
        return;
    }

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

    try {
        const response = await fetch("{{ url_for('verify_otp') }}", {
            method: 'POST',
            headers: { 
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "otp=" + encodeURIComponent(otp)
        });

        const data = await response.json();
        
        if (data.success) {
            showMessage(data.message, 'success');
            
            // Redirect based on purpose
            setTimeout(() => {
                {% if purpose == 'registration' %}
                    window.location.href = "{{ url_for('login') }}";
                {% else %}
                    window.location.href = "{{ url_for('reset_password') }}";
                {% endif %}
            }, 2000);
        } else {
            showMessage(data.message, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Verify OTP';
        }
    } catch (error) {
        showMessage('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Verify OTP';
    }
});
              

        // Auto-focus on first OTP input
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('otp-1').focus();
        });

        // Allow only numbers in OTP inputs
        document.querySelectorAll('.otp-input input').forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        });

        // Handle paste event for OTP
        document.addEventListener('paste', function(e) {
            const activeElement = document.activeElement;
            if (activeElement && activeElement.id && activeElement.id.startsWith('otp-')) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(pastedData)) {
                    const digits = pastedData.split('');
                    digits.forEach((digit, index) => {
                        const otpField = document.getElementById(`otp-${index + 1}`);
                        if (otpField) {
                            otpField.value = digit;
                        }
                    });
                    document.getElementById('otp-6').focus();
                }
            }
        });
    </script>
</body>
</html>
