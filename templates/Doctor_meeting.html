<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Meeting - CardioVision AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .doctor-meeting-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .doctor-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #34495e;
            padding: 15px 20px;
            color: white;
        }

        .appointments-section {
            padding: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .appointments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .appointment-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .appointment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .appointment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .patient-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-scheduled {
            background: #ffeaa7;
            color: #e17055;
        }

        .status-active {
            background: #55efc4;
            color: #00b894;
        }

        .status-completed {
            background: #dfe6e9;
            color: #636e72;
        }

        .appointment-details {
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #7f8c8d;
        }

        .value {
            color: #2c3e50;
        }

        .room-id {
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-family: monospace;
        }

        .appointment-actions {
            text-align: center;
            margin-top: 15px;
        }

        .btn-start-call {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .btn-start-call:hover {
            background: #c0392b;
        }

        .btn-join-call {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .btn-join-call:hover {
            background: #219a52;
        }

        .completed-text {
            color: #7f8c8d;
            font-style: italic;
        }

        .no-appointments {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #3498db;
            font-size: 1.1rem;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="doctor-meeting-container">
        <!-- Header Section -->
        <div class="header">
            <h1>Doctor Meeting Dashboard</h1>
            <p>CardioVision AI - Video Consultation Portal</p>
        </div>

        <!-- Doctor Information -->
        <div class="doctor-info">
            <div class="doctor-name">
                <strong>Dr. John Smith</strong> - Cardiologist
            </div>
            <div class="current-time" id="currentTime">
                <!-- Current time will be updated by JavaScript -->
            </div>
        </div>

        <!-- Appointments Section -->
        <div class="appointments-section">
            <h2 class="section-title">Today's Appointments</h2>
            
            <!-- Filter Buttons -->
            <div class="filters">
                <button class="filter-btn active" onclick="filterAppointments('all')">All</button>
                <button class="filter-btn" onclick="filterAppointments('scheduled')">Scheduled</button>
                <button class="filter-btn" onclick="filterAppointments('active')">Active</button>
                <button class="filter-btn" onclick="filterAppointments('completed')">Completed</button>
            </div>

            <!-- Appointments Grid -->
            <div class="appointments-grid" id="appointmentsGrid">
                <!-- Appointment cards will be loaded here by JavaScript -->
                <div class="loading">Loading appointments...</div>
            </div>
        </div>
    </div>

    <script>
        // Sample appointment data - In real application, this comes from your backend
        const appointments = [
            {
                id: 1,
                patient_name: "Robert Johnson",
                appointment_time: "2024-01-15T10:00:00",
                appointment_type: "Video Consultation",
                call_status: "scheduled",
                room_id: null,
                patient_age: 45,
                reason: "Heart disease follow-up"
            },
            {
                id: 2,
                patient_name: "Sarah Williams",
                appointment_time: "2024-01-15T11:30:00",
                appointment_type: "Video Consultation",
                call_status: "active",
                room_id: "CV-789-XYZ",
                patient_age: 52,
                reason: "Cardiac risk assessment"
            },
            {
                id: 3,
                patient_name: "Michael Brown",
                appointment_time: "2024-01-15T14:00:00",
                appointment_type: "Video Consultation",
                call_status: "completed",
                room_id: "CV-456-ABC",
                patient_age: 38,
                reason: "Post-treatment checkup"
            },
            {
                id: 4,
                patient_name: "Emily Davis",
                appointment_time: "2024-01-15T15:30:00",
                appointment_type: "Video Consultation",
                call_status: "scheduled",
                room_id: null,
                patient_age: 61,
                reason: "Hypertension consultation"
            }
        ];

        // Function to display appointments
        function displayAppointments(appointmentsToShow = appointments) {
            const grid = document.getElementById('appointmentsGrid');
            
            if (appointmentsToShow.length === 0) {
                grid.innerHTML = '<div class="no-appointments">No appointments found for the selected filter.</div>';
                return;
            }

            grid.innerHTML = appointmentsToShow.map(appointment => `
                <div class="appointment-card" data-status="${appointment.call_status}">
                    <div class="appointment-header">
                        <div class="patient-name">${appointment.patient_name}</div>
                        <span class="status-badge status-${appointment.call_status}">
                            ${appointment.call_status.toUpperCase()}
                        </span>
                    </div>
                    
                    <div class="appointment-details">
                        <div class="detail-row">
                            <span class="label">Time:</span>
                            <span class="value">${formatTime(appointment.appointment_time)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Date:</span>
                            <span class="value">${formatDate(appointment.appointment_time)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Type:</span>
                            <span class="value">${appointment.appointment_type}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Age:</span>
                            <span class="value">${appointment.patient_age} years</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Reason:</span>
                            <span class="value">${appointment.reason}</span>
                        </div>
                        ${appointment.room_id ? `
                        <div class="detail-row">
                            <span class="label">Room ID:</span>
                            <span class="value room-id">${appointment.room_id}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="appointment-actions">
                        ${appointment.call_status === 'scheduled' ? 
                            `<button class="btn-start-call" onclick="startCall(${appointment.id})">Start Call</button>` : 
                        appointment.call_status === 'active' ? 
                            `<button class="btn-join-call" onclick="joinCall('${appointment.room_id}')">Join Call</button>` : 
                        appointment.call_status === 'completed' ? 
                            `<span class="completed-text">Call Completed</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Filter appointments
        function filterAppointments(status) {
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (status === 'all') {
                displayAppointments();
            } else {
                const filtered = appointments.filter(apt => apt.call_status === status);
                displayAppointments(filtered);
            }
        }

        // Start call function
        function startCall(appointmentId) {
            // In real application, this would call your backend API
            const roomId = 'CV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            
            // Update the appointment status locally (in real app, this would be via API call)
            const appointment = appointments.find(apt => apt.id === appointmentId);
            if (appointment) {
                appointment.call_status = 'active';
                appointment.room_id = roomId;
                
                alert(`Call started! Room ID: ${roomId}\nPatient has been notified via email.`);
                displayAppointments();
            }
        }

        // Join call function
        function joinCall(roomId) {
            alert(`Joining call with Room ID: ${roomId}`);
            // In real application, this would redirect to video call page
            // window.location.href = `/video-call?room=${roomId}`;
        }

        // Utility functions
        function formatTime(dateTimeString) {
            return new Date(dateTimeString).toLocaleTimeString([], { 
                hour: '2-digit', minute: '2-digit' 
            });
        }

        function formatDate(dateTimeString) {
            return new Date(dateTimeString).toLocaleDateString();
        }

        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            displayAppointments();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
        });
    </script>
</body>
</html>
